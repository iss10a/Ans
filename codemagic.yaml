# Codemagic configuration.
#
# The GitHub Actions workflow in .github/workflows/build-apk.yml does the same
# job for free and needs no account, so this file is the alternative rather than
# the primary route. Both produce an installable, signed APK without any Google
# Play or developer-account setup.

workflows:
  android-apk:
    name: Android APK
    instance_type: linux_x2
    max_build_duration: 45

    environment:
      java: 17
      vars:
        KEYSTORE_PASSWORD: "android"
        KEY_ALIAS: "upload"
        KEY_PASSWORD: "android"

    triggering:
      events:
        - push
        - tag
      cancel_previous_builds: true

    scripts:
      - name: Show the toolchain
        script: |
          set -euo pipefail
          java -version
          gradle --version

      - name: Generate a signing key
        script: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$CM_BUILD_DIR/release.jks" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=Git Folder Uploader, OU=CI, O=Personal, L=None, S=None, C=US"

      - name: Build the release APK
        script: |
          set -euo pipefail
          export KEYSTORE_PATH="$CM_BUILD_DIR/release.jks"
          gradle --no-daemon assembleRelease

      - name: List the outputs
        script: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/release/

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/**/mapping.txt
